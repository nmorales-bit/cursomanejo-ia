<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cursomandejoIA - Asistente de Manejo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    <!-- Header principal -->
    <header class="app-header">
      <div class="header-content">
        <span class="icon">🚗</span>
        <h1>cursomandejoIA</h1>
      </div>
      <p class="subtitle">Tu asistente inteligente para obtener la licencia de conducir</p>
    </header>

    <!-- Estructura del boceto: zona chat -->
    <section class="zona chat" id="zona-chat" aria-label="Historial de mensajes">
      <div class="message agent">
        <div class="bubble">
          ¡Hola! 👋 Soy <strong>cursomandejoIA</strong>. Estoy acá para ayudarte con todo lo relativo al curso de manejo, reglas de tránsito, señales y el examen para sacar tu registro. ¿Qué te gustaría consultar hoy?
        </div>
      </div>
    </section>

    <!-- Estructura del boceto: zona de escritura -->
    <section class="zona de escritura" aria-label="Área de envío de mensaje">
      <form id="chat-form" class="input-container">
        <textarea 
          id="user-input" 
          placeholder="Escribí tu duda sobre el examen o reglas de manejo..." 
          rows="1" 
          required
        ></textarea>
        <button type="submit" id="send-btn" title="Enviar mensaje">
          <span>Enviar</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
